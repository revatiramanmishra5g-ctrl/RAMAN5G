- task: TerraformTask@5
  inputs:
    provider: 'azurerm'
    command: 'init'
    backendAzureRmOverrideSubscriptionID: 'f6edbd89-ccf2-49a5-8d2c-0e9c150bc931'
    backendAzureRmResourceGroupName: 'RRMOCT'
    backendAzureRmStorageAccountName: 'rrm101126'
    backendAzureRmContainerName: '$logs'
    backendAzureRmKey: 'terraform.tfstate'
trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:
- checkout: self

- task: TerraformInstaller@1
  displayName: 'Install Terraform'
  inputs:
    terraformVersion: '1.8.5'

- task: AzureCLI@2
  displayName: 'Terraform Init, Validate and Plan'
  inputs:
    azureSubscription: 'sc-azure-terraform'
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      set -e
      terraform init
      terraform validate
      terraform plan -out=tfplan
  env:
    ARM_USE_CLI: true
